<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook 邮件系统 - 账号管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .admin-toolbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .admin-toolbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-tool {
            padding: 10px 18px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            background: white;
            color: var(--gray-600);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-tool:hover {
            background: var(--gray-50);
            border-color: var(--primary-light);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-tool.btn-danger:hover {
            background: #FEF2F2;
            border-color: #FCA5A5;
            color: var(--danger);
        }

        .search-input-admin {
            position: relative;
            width: 280px;
        }

        .search-input-admin i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            pointer-events: none;
        }

        .search-input-admin input {
            padding-left: 40px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            width: 100%;
            transition: all 0.3s;
        }

        .btn-tool.btn-oauth {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: transparent;
        }
        .btn-tool.btn-oauth:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #3730a3 100%);
            color: white;
            border-color: transparent;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* OAuth 状态提示条 */
        .oauth-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s ease;
        }
        .oauth-toast.success { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
        .oauth-toast.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
        .oauth-toast.info    { background: #eff6ff; color: #1e40af; border: 1px solid #93c5fd; }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h2><i class="bi bi-gear-wide-connected me-2"></i>Outlook 邮件系统 - 账号管理</h2>
                <p>管理邮箱账户、标签和系统配置</p>
            </div>

            <div class="admin-content">
                <!-- Login Section -->
                <div id="loginSection" class="login-section">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock display-4"></i>
                        <h4 class="mt-3">身份验证</h4>
                        <p class="text-muted">请输入管理令牌以访问账号管理功能</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="tokenInput" class="form-label">管理令牌</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" class="form-control" id="tokenInput"
                                       placeholder="请输入管理令牌" required>
                            </div>
                            <div class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                默认令牌：admin123（可通过环境变量 ADMIN_TOKEN 修改）
                            </div>
                        </div>

                        <button type="submit" class="btn btn-admin w-100">
                            <i class="bi bi-unlock me-2"></i>验证并登录
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>返回邮件管理
                        </a>
                    </div>
                </div>

                <!-- Management Section -->
                <div id="managementSection" class="management-section">
                    <!-- Toolbar -->
                    <div class="admin-toolbar">
                        <div class="admin-toolbar-left">
                            <button class="btn-tool btn-oauth" id="oauthAddAccountBtn">
                                <i class="bi bi-person-plus-fill"></i>OAuth 添加账号
                            </button>
                            <button class="btn-tool" id="openImportModalBtn">
                                <i class="bi bi-upload"></i>导入
                            </button>
                            <button class="btn-tool" id="exportDataBtn">
                                <i class="bi bi-download"></i>导出
                            </button>
                        </div>
                        <div class="admin-toolbar-right">
                            <div class="search-input-admin">
                                <i class="bi bi-search"></i>
                                <input type="text" id="accountSearchInput" placeholder="搜索邮箱...">
                            </div>
                            <button class="btn-tool" id="refreshAccountsBtn" title="刷新">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Accounts Table -->
                    <div class="accounts-table-wrapper">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 50px" class="text-center">#</th>
                                    <th style="width: 40%">邮箱地址</th>
                                    <th>标签</th>
                                    <th class="text-end" style="width: 160px">操作</th>
                                </tr>
                            </thead>
                            <tbody id="accountsTbody">
                                <tr>
                                    <td colspan="4" class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status"></div>
                                        <div class="mt-3 text-muted">正在加载账号列表...</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="accounts-pagination">
                        <div class="pagination-info" id="accountsPagerInfo">第 1 / 1 页，共 0 条</div>
                        <div class="pagination-buttons">
                            <button class="btn-page" id="prevPageBtn" disabled>
                                <i class="bi bi-chevron-left"></i>上一页
                            </button>
                            <button class="btn-page" id="nextPageBtn" disabled>
                                下一页<i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Footer Actions -->
                    <div class="management-footer">
                        <div class="d-flex justify-content-center gap-3">
                            <button class="btn btn-outline-danger" id="logoutBtn">
                                <i class="bi bi-box-arrow-right me-2"></i>退出管理
                            </button>
                            <a href="/" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>返回邮件管理
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">
                        <i class="bi bi-check-circle-fill me-2"></i>操作成功
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="successMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        <i class="bi bi-check-lg me-1"></i>确定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-danger">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>错误提示
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>确定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tag Management Modal -->
    <div class="modal fade" id="tagManagementModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tagManagementModalTitle">
                        <i class="bi bi-tags-fill me-2"></i>管理标签
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="tagManagementInput" class="form-label">标签</label>
                        <input type="text" class="form-control" id="tagManagementInput"
                               placeholder="输入标签，用逗号分隔，如：微软,谷歌,苹果">
                        <div class="form-text">
                            <i class="bi bi-lightbulb me-1"></i>
                            多个标签用逗号分隔，如：微软,谷歌,苹果
                        </div>
                    </div>

                    <div class="mb-3">
                        <small class="text-muted">当前标签：</small>
                        <div id="tagManagementCurrentTags" class="mt-2">
                            <span class="text-muted">暂无标签</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>取消
                    </button>
                    <button type="button" class="btn btn-primary" id="tagManagementSaveBtn">
                        <i class="bi bi-check-lg me-1"></i>保存标签
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-upload me-2"></i>批量导入账号
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>支持的格式：</strong>
                        <ul class="mb-0 mt-2">
                            <li>完整格式：邮箱----密码----client_id----refresh_token</li>
                            <li>简化格式：邮箱----refresh_token</li>
                        </ul>
                    </div>
                    <div class="mb-3">
                        <label for="importTextarea" class="form-label">账户数据</label>
                        <textarea class="form-control" id="importTextarea" rows="10" placeholder="每行一个账户，使用四个短横线（----）分隔字段"></textarea>
                    </div>
                    <div>
                        <label for="mergeMode" class="form-label">合并模式</label>
                        <select class="form-select" id="mergeMode">
                            <option value="update">更新现有账户</option>
                            <option value="skip">跳过重复账户</option>
                            <option value="replace">替换所有数据</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>取消
                    </button>
                    <button type="button" class="btn btn-primary" id="executeImportBtn">
                        <i class="bi bi-upload me-1"></i>开始导入
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
