<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook邮件查看器</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .email-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .email-header {
            background: #0078d4;
            color: white;
            padding: 20px 25px;
        }

        .email-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group-custom {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group-custom input {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .input-group-custom input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        .btn-custom {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-primary-custom {
            background: white;
            color: #0078d4;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary-custom {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary-custom:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .email-content {
            padding: 20px 25px;
        }

        .email-meta {
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .email-subject {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .email-info {
            display: grid;
            gap: 8px;
            font-size: 13px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #718096;
        }

        .info-row i {
            color: #0078d4;
            width: 16px;
            font-size: 14px;
        }

        .info-label {
            font-weight: 600;
            min-width: 60px;
        }

        .info-value {
            color: #2d3748;
        }

        .email-body {
            font-size: 14px;
            line-height: 1.6;
            color: #2d3748;
            max-height: 500px;
            overflow-y: auto;
        }

        /* 移除邮件正文中的边框 */
        .email-body * {
            border: none !important;
            outline: none !important;
        }

        .email-body table {
            width: 100%;
            border-collapse: collapse;
        }

        .email-body img {
            max-width: 100%;
            height: auto;
        }

        .email-body h1, .email-body h2, .email-body h3 {
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .email-body p {
            margin-bottom: 12px;
        }

        .email-body a {
            color: #0078d4;
            text-decoration: none;
        }

        .email-body a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0aec0;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0078d4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge-custom {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(0, 120, 212, 0.1);
            color: #0078d4;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }


        /* 模态框样式优化 */
        .modal-content {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            background: #0078d4;
            color: white;
            border-radius: 12px 12px 0 0;
            border-bottom: none;
            padding: 15px 20px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.8;
        }

        .modal-header .btn-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body .form-label {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .modal-body .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 12px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .modal-body .form-control:focus {
            border-color: #0078d4;
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
        }

        .modal-body .alert-info {
            background: rgba(0, 120, 212, 0.1);
            border: 1px solid rgba(0, 120, 212, 0.2);
            color: #2d3748;
            border-radius: 6px;
            font-size: 13px;
            padding: 10px 12px;
        }

        .modal-body .btn-primary {
            background: #0078d4;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        .modal-body .btn-primary:hover {
            background: #005a9e;
        }

        .modal-body .btn-outline-secondary {
            border: 1px solid #e2e8f0;
            color: #718096;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        .modal-body .btn-outline-secondary:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .modal-body .btn-outline-danger {
            border: 1px solid #fc8181;
            color: #e53e3e;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
        }

        .modal-body .btn-outline-danger:hover {
            background: #fff5f5;
            border-color: #fc8181;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .email-container {
                border-radius: 12px;
            }

            .email-header {
                padding: 15px;
            }

            .email-header h1 {
                font-size: 18px;
            }

            .email-content {
                padding: 15px;
            }

            .input-group-custom {
                width: 100%;
            }

            .input-group-custom input {
                min-width: 100%;
            }

            .action-buttons {
                width: 100%;
            }

            .btn-custom {
                flex: 1;
            }
        }

        /* 美化滚动条 */
        .email-body::-webkit-scrollbar {
            width: 8px;
        }

        .email-body::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .email-body::-webkit-scrollbar-thumb {
            background: #0078d4;
            border-radius: 10px;
        }

        .email-body::-webkit-scrollbar-thumb:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- 头部 -->
        <div class="email-header">
            <h1>
                <i class="bi bi-envelope-open"></i>
                Mail
            </h1>
            
            <!-- 邮箱输入和按钮 -->
            <form id="emailForm">
                <div class="input-group-custom">
                    <input type="email" id="emailInput" placeholder="输入邮箱地址" required>
                    <button type="submit" class="btn-custom btn-primary-custom">
                        <i class="bi bi-search"></i>
                        查看邮件
                    </button>
                    <div class="action-buttons">
                        <button type="button" class="btn-custom btn-secondary-custom" id="tempAccountBtn">
                            <i class="bi bi-person-plus"></i>
                            临时账户
                        </button>
                        <button type="button" class="btn-custom btn-secondary-custom" id="refreshBtn" style="display: none;">
                            <i class="bi bi-arrow-clockwise"></i>
                            刷新
                        </button>
                    </div>
                </div>
            </form>

        </div>

        <!-- 邮件内容 -->
        <div class="email-content" id="emailContent">
            <!-- 空状态 -->
            <div class="empty-state">
                <i class="bi bi-envelope"></i>
                <h3>输入邮箱查看最新邮件</h3>
                <p>在上方输入邮箱地址，即可查看该邮箱的最新一封邮件</p>
            </div>
        </div>
    </div>

    <!-- 临时账户模态框 -->
    <div class="modal fade" id="tempAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus me-2"></i>
                        临时账户设置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle me-2"></i>
                        临时账户信息仅在当前浏览器会话中有效，不会保存到服务器。
                    </div>
                    
                    <form id="tempAccountForm">
                        <div class="mb-3">
                            <label for="tempEmail" class="form-label">
                                <i class="bi bi-envelope me-1"></i>邮箱地址
                            </label>
                            <input type="email" class="form-control" id="tempEmail" 
                                   placeholder="请输入邮箱地址" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tempPassword" class="form-label">
                                <i class="bi bi-lock me-1"></i>密码（可选）
                            </label>
                            <input type="password" class="form-control" id="tempPassword" 
                                   placeholder="请输入密码">
                        </div>
                        
                        <div class="mb-3">
                            <label for="tempRefreshToken" class="form-label">
                                <i class="bi bi-shield-lock me-1"></i>Refresh Token <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="tempRefreshToken" rows="3" 
                                      placeholder="请输入Refresh Token" required></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                                取消
                            </button>
                            <div>
                                <button type="button" class="btn btn-outline-danger me-2" id="clearTempAccountBtn">
                                    清除
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    保存并使用
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script_simple.js"></script>
</body>
</html>
