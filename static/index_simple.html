<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook 邮件查看器</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --secondary: #0EA5E9;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --dark: #1E293B;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .app-container {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl), 0 0 100px rgba(79, 70, 229, 0.2);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header Section */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 28px 36px;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: headerGlow 8s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title i {
            font-size: 32px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .app-subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 24px;
        }

        /* 搜索行：输入框 + 查看按钮 */
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 18px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            font-size: 15px;
            background: rgba(255, 255, 255, 0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2), var(--shadow-lg);
        }

        .search-input::placeholder {
            color: var(--gray-400);
        }

        .btn {
            padding: 13px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 18px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
        }

        /* Main Content */
        .app-content {
            padding: 28px 36px;
            min-height: 460px;
        }

        /* Email Display */
        .email-card {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .email-header {
            background: linear-gradient(135deg, var(--gray-50) 0%, white 100%);
            padding: 20px 28px;
            border-bottom: 1px solid var(--gray-200);
        }

        .email-subject {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .email-meta {
            display: grid;
            gap: 12px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .meta-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .meta-label {
            color: var(--gray-500);
            font-weight: 500;
            min-width: 60px;
        }

        .meta-value {
            color: var(--gray-700);
            font-weight: 600;
        }

        .email-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .email-body {
            padding: 28px 32px;
            font-size: 15px;
            line-height: 1.8;
            color: var(--gray-700);
            max-height: none;
            overflow-y: visible;
        }

        .email-body::-webkit-scrollbar {
            width: 8px;
        }

        .email-body::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 10px;
        }

        .email-body::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-light) 0%, var(--primary) 100%);
            border-radius: 10px;
        }

        .email-body::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Email body content styling */
        .email-body img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
            margin: 12px 0;
        }

        .email-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .email-body table td,
        .email-body table th {
            padding: 12px;
            border: 1px solid var(--gray-200);
        }

        .email-body a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .email-body a:hover {
            text-decoration: underline;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            animation: fadeIn 0.6s ease;
        }

        .empty-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: var(--gray-400);
            position: relative;
        }

        .empty-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px dashed var(--gray-300);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .empty-description {
            font-size: 14px;
            color: var(--gray-500);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 80px 40px;
        }

        .loader {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
        }

        .loader-circle {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .loader-circle:nth-child(2) {
            inset: 8px;
            border-top-color: var(--secondary);
            animation-duration: 1.5s;
            animation-direction: reverse;
        }

        .loader-circle:nth-child(3) {
            inset: 16px;
            border-top-color: var(--success);
            animation-duration: 2s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: 8px;
        }

        .loading-subtext {
            font-size: 13px;
            color: var(--gray-400);
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 40px;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--danger);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 8px;
        }

        .error-message {
            font-size: 14px;
            color: var(--gray-600);
        }

        /* Modal Styling */
        .modal-content {
            border: none;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-bottom: none;
            padding: 24px 32px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .modal-header .btn-close:hover {
            opacity: 1;
        }

        .modal-body {
            padding: 32px;
        }

        .modal-body .form-label {
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .modal-body .form-control {
            border: 2px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 12px 16px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .modal-body .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .modal-body .alert-info {
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            border: none;
            color: var(--gray-700);
            border-radius: var(--radius);
            font-size: 13px;
            padding: 16px;
        }

        .modal-body .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 14px;
            color: white;
            box-shadow: var(--shadow-md);
        }

        .modal-body .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .modal-body .btn-outline-secondary {
            border: 2px solid var(--gray-200);
            color: var(--gray-600);
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 14px;
            background: white;
        }

        .modal-body .btn-outline-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .modal-body .btn-outline-danger {
            border: 2px solid #FECACA;
            color: var(--danger);
            padding: 12px 24px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 14px;
            background: white;
        }

        .modal-body .btn-outline-danger:hover {
            background: #FEF2F2;
            border-color: #FCA5A5;
        }

        .modal-footer {
            padding: 24px 32px;
            border-top: 1px solid var(--gray-200);
            background: var(--gray-50);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .app-container {
                border-radius: var(--radius-lg);
            }

            .app-header {
                padding: 20px 16px;
            }

            .app-title {
                font-size: 20px;
            }

            .app-subtitle {
                font-size: 13px;
                margin-bottom: 16px;
            }

            .app-content {
                padding: 20px 16px;
            }

            .search-row {
                flex-direction: column;
            }

            .search-row .btn {
                width: 100%;
                justify-content: center;
            }

            .action-buttons {
                flex-wrap: wrap;
            }

            .action-buttons .btn {
                flex: 1;
                justify-content: center;
                min-width: 100px;
            }

            .email-header {
                padding: 16px 20px;
            }

            .email-subject {
                font-size: 17px;
            }

            .email-body {
                padding: 16px 20px;
            }

            .empty-state {
                padding: 48px 16px;
            }

            .empty-icon {
                width: 90px;
                height: 90px;
                font-size: 44px;
            }
        }

        /* Quick Access Buttons */
        .quick-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .quick-action-btn {
            padding: 10px 16px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            color: var(--gray-600);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-action-btn:hover {
            background: var(--gray-50);
            border-color: var(--primary-light);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .quick-action-btn i {
            font-size: 16px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 16px 32px;
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--gray-600);
        }

        .stat-item i {
            color: var(--primary);
        }

        .stat-item strong {
            color: var(--gray-800);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <i class="bi bi-envelope-heart-fill"></i>
                    Outlook 邮件查看器
                </h1>
                <p class="app-subtitle">快速查看最新邮件，简洁高效</p>
                
                <form id="emailForm">
                    <div class="search-form">
                        <div class="search-row">
                            <div class="search-input-wrapper">
                                <i class="bi bi-envelope-at"></i>
                                <input type="email" id="emailInput" class="search-input" placeholder="输入邮箱地址，按回车查看邮件" required>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="btn-icon bi bi-search"></i>
                                查看邮件
                            </button>
                        </div>
                        <div class="action-buttons">
                            <button type="button" class="btn btn-secondary" id="tempAccountBtn">
                                <i class="btn-icon bi bi-person-plus"></i>
                                临时账户
                            </button>
                            <button type="button" class="btn btn-secondary" id="refreshBtn" style="display: none;">
                                <i class="btn-icon bi bi-arrow-clockwise"></i>
                                刷新
                            </button>
                            <a href="/admin" class="btn btn-secondary" title="管理后台">
                                <i class="btn-icon bi bi-gear"></i>
                                管理
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Main Content -->
        <div class="app-content" id="emailContent">
            <!-- Empty State -->
            <div class="empty-state">
                <div class="empty-icon">
                    <i class="bi bi-inbox"></i>
                </div>
                <h3 class="empty-title">准备好查看邮件了</h3>
                <p class="empty-description">在上方输入邮箱地址，立即查看该邮箱的最新邮件</p>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="document.getElementById('emailInput').focus()">
                        <i class="bi bi-pencil-square"></i>
                        开始输入
                    </button>
                    <button class="quick-action-btn" id="quickTempAccountBtn">
                        <i class="bi bi-person-plus"></i>
                        使用临时账户
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Temp Account Modal -->
    <div class="modal fade" id="tempAccountModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-plus me-2"></i>
                        临时账户设置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle me-2"></i>
                        临时账户信息仅在当前浏览器会话中有效，刷新页面后将自动清除。
                    </div>

                    <form id="tempAccountForm">
                        <div class="mb-3">
                            <label for="tempEmail" class="form-label">
                                <i class="bi bi-envelope me-1"></i>邮箱地址
                            </label>
                            <input type="email" class="form-control" id="tempEmail"
                                   placeholder="example@outlook.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="tempPassword" class="form-label">
                                <i class="bi bi-lock me-1"></i>密码（可选）
                            </label>
                            <input type="password" class="form-control" id="tempPassword"
                                   placeholder="输入邮箱密码">
                        </div>

                        <div class="mb-3">
                            <label for="tempRefreshToken" class="form-label">
                                <i class="bi bi-shield-check me-1"></i>Refresh Token <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="tempRefreshToken" rows="3"
                                      placeholder="粘贴您的 Refresh Token" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                                取消
                            </button>
                            <div>
                                <button type="button" class="btn btn-outline-danger me-2" id="clearTempAccountBtn">
                                    <i class="bi bi-trash me-1"></i>清除
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>保存并使用
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script_simple.js"></script>
</body>
</html>
